<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link href="../style/output.css" rel="stylesheet" />
</head>
<body class="flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav
      class="z-10 sticky top-0 flex items-center gap-12 w-full px-[5vw] py-5 h-[80px] border-b border-grey bg-white"
    >
      <img src="../assets/images/logo.png" class="flex-none w-16" />

      <div
        id="searchBox"
        class="absolute bg-white w-full left-0 top-full mt-0.5 border-b border-gray-50 py-4 px-[5vw] md:border-0 md:block md:relative md:inset-0 md:p-0 md:w-auto"
      >
        <input
          type="text"
          placeholder="Search"
          class="w-full md:w-auto bg-gray-100 p-4 pl-6 pr-[12%] md:pr-6 rounded-full placeholder:text-gray-500 md:pl-12"
        />
        <i
          class="fas fa-search absolute right-[10%] md:pointer-events-none md:left-5 top-1/2 -translate-y-1/2 text-xl text-gray-500"
        ></i>
      </div>

      <div class="flex items-center gap-3 md:gap-6 ml-auto" id="navArea">
        <button
          id="searchToggle"
          class="md:hidden bg-gray-50 w-12 h-12 rounded-full flex items-center justify-center"
        >
          <i class="fas fa-search text-xl"></i>
        </button>
        <a href="#" class="hidden md:flex gap-2">
          <i class="fi fi-rr-pen-clip"></i>
          <p>Write</p>
        </a>

        <!-- Group nút đăng nhập / đăng ký -->
        <div id="authButtons" class="flex gap-2 items-center">
          <a
            href="../login/login.html"
            class="whitespace-nowrap bg-black text-white rounded-full py-3 px-6 text-xl capitalize hover:bg-opacity-80"
          >
            <p>Sign In</p>
          </a>
          <a
            href="../login/signup.html"
            class="whitespace-nowrap bg-gray-300 text-black rounded-full py-3 px-6 text-xl capitalize hover:bg-opacity-80 hidden md:block"
          >
            <p>Sign Up</p>
          </a>
        </div>

        <div class="relative">
          <!-- Avatar -->
          <img
            id="avatarImg"
            class="hidden w-12 h-12 rounded-full cursor-pointer"
          />

          <!-- Dropdown Menu -->
          <div
            id="avatarDropdown"
            class="hidden absolute right-0 mt-3 w-64 bg-white border border-gray-200 rounded-xl shadow-xl z-50 overflow-hidden"
          >
            <div class="px-5 py-3 hover:bg-gray-100 cursor-pointer">
              <span class="block text-gray-800 text-base font-semibold"
                >Sign Out</span
              >
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex h-full justify-center">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-md min-h-screen p-4">
            <h2 class="text-xl font-bold mb-6">Dashboard</h2>
            <nav>
                <a href="#" class="nav-link" onclick="window.location.href='../Dashboard Page/index.html'">Blogs</a>
                <a href="#" class="nav-link" onclick="window.location.href='../Write Page/index.html'">Write</a>
            </nav>
            <h2 class="text-xl font-bold mb-6 mt-12">Settings</h2>
            <nav>
                <a href="#" id="editProfileBtn" class="nav-link">Edit Profile</a>
                <a href="#" id="changePasswordBtn" class="nav-link">Change Password</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div id="editProfile" class="settings-section">
                    <h3 class="text-xl font-semibold">Edit Profile</h3>
                    <section class="avatar">
                        <!-- Avatar Upload -->
                        <div class="user-photo">
                            <label for="upload-photo" id="photo-label">
                                <img id="preview-photo"/>
                            </label>
                            <input type="file" id="upload-photo" accept="image/*" />
                        </div>
                    </section>

                    <!-- User Info -->
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-gray-600">Username</label>
                            <input type="text" class="input-field" readonly>
                        </div>
                        <div>
                            <label class="text-gray-600">Email</label>
                            <input type="email" class="input-field" readonly>
                        </div>
                        <div class="col-span-2">
                            <label class="text-gray-600">Bio</label>
                            <textarea class="input-field h-24" placeholder="Write about yourself..."></textarea>
                            <p class="text-gray-500 text-sm mt-1">200 characters left</p>
                        </div>
                    </div>

                    <!-- Update Button -->
                    <button class="btn-update mt-4 rounded-full">Update</button>
                </div>
                
                <div id="changePassword" class="settings-section hidden">
                    <h3 class="text-xl font-semibold">Change Password</h3>
                    <label class="block mt-4">Current Password</label>
                    <input type="password" id="currentPassword" class="input-field">
                    <label class="block mt-4">New Password</label>
                    <input type="password" id="newPassword" class="input-field">
                    <label class="block mt-4">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="input-field">
                    <button class="btn-update mt-4 rounded-full">Change Password</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
