<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav
      class="z-10 sticky top-0 flex items-center gap-12 w-full px-[5vw] py-5 h-[80px] border-b border-grey bg-white"
    >
      <img src="../assets/images/logo.png" class="flex-none w-16" />

      <div
        id="searchBox"
        class="absolute bg-white w-full left-0 top-full mt-0.5 border-b border-gray-50 py-4 px-[5vw] md:border-0 md:block md:relative md:inset-0 md:p-0 md:w-auto"
      >
        <input
          type="text"
          placeholder="Search"
          class="w-full md:w-auto bg-gray-100 p-4 pl-6 pr-[12%] md:pr-6 rounded-full placeholder:text-gray-500 md:pl-12"
        />
        <i
          class="fas fa-search absolute right-[10%] md:pointer-events-none md:left-5 top-1/2 -translate-y-1/2 text-xl text-gray-500"
        ></i>
      </div>

      <div class="flex items-center gap-3 md:gap-6 ml-auto" id="navArea">
        <button
          id="searchToggle"
          class="md:hidden bg-gray-50 w-12 h-12 rounded-full flex items-center justify-center"
        >
          <i class="fas fa-search text-xl"></i>
        </button>
        <a href="#" class="hidden md:flex gap-2">
          <i class="fi fi-rr-pen-clip"></i>
          <p>Write</p>
        </a>

        <!-- Group nút đăng nhập / đăng ký -->
        <div id="authButtons" class="flex gap-2 items-center">
          <a
            href="../login/login.html"
            class="whitespace-nowrap bg-black text-white rounded-full py-3 px-6 text-xl capitalize hover:bg-opacity-80"
          >
            <p>Sign In</p>
          </a>
          <a
            href="../login/signup.html"
            class="whitespace-nowrap bg-gray-300 text-black rounded-full py-3 px-6 text-xl capitalize hover:bg-opacity-80 hidden md:block"
          >
            <p>Sign Up</p>
          </a>
        </div>

        <div class="relative">
          <!-- Avatar -->
          <img
            id="avatarImg"
            class="hidden w-12 h-12 rounded-full cursor-pointer"
          />

          <!-- Dropdown Menu -->
          <div
            id="avatarDropdown"
            class="hidden absolute right-0 mt-3 w-64 bg-white border border-gray-200 rounded-xl shadow-xl z-50 overflow-hidden"
          >
            <div class="px-5 py-3 hover:bg-gray-100 cursor-pointer">
              <span class="block text-gray-800 text-base font-semibold"
                >Sign Out</span
              >
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex h-full justify-center">
        <!-- Sidebar -->    
        <aside class="w-64 bg-white shadow-md min-h-screen p-4">
            <h2 class="text-xl font-bold mb-6">Dashboard</h2>
            <nav>
                <a href="#" class="nav-link active">Blogs</a>
                <a href="#" class="nav-link" onclick="window.location.href='../Write Page/index.html'">Write</a>
            </nav>
            <h2 class="text-xl font-bold mb-6 mt-12">Settings</h2>
            <nav>
                <a href="#" id="editProfileBtn" class="nav-link" onclick="window.location.href='../Setting Page/index.html'">Edit Profile</a>
                <a href="#" id="changePasswordBtn" class="nav-link" onclick="window.location.href='../Setting Page/index.html'">Change Password</a>
            </nav>
        </aside>

        <main class="content">
            <h2>Manage Blogs</h2>
            <input type="text" class="search-blogs" placeholder="Search Blogs">
            
            <div class="tabs">
                <button class="tab active">Published Blogs</button>
                <button class="tab">Drafts</button>
            </div>

            <div class="blog-list">
                <div class="blog-card">
                    <img src="https://via.placeholder.com/80" class="blog-img">
                    <div class="blog-info">
                        <h3>test blog 1</h3>
                        <p>Published on 29 Sep, Friday</p>
                        <div class="blog-actions">
                            <a href="#" class="edit">Edit</a>
                            <a href="#" class="delete">Delete</a>
                        </div>
                    </div>
                    <div class="blog-stats">
                        <div>0 Likes</div>
                        <div>0 Comments</div>
                        <div>0 Reads</div>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
